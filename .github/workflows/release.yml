name: Windows release

# Builds the Windows NSIS installer (the asset the in-app updater downloads) and
# a portable zip, then attaches them to the GitHub release for the version in
# package.json.
#
# - release missing  -> create it for tag v<version>
# - release present but has no .exe -> upload the Windows assets to it
# - release present with an .exe    -> nothing to do
#
# Safe to re-run: no build or upload happens once the Windows asset exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Inspect existing release
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            : > assets.txt
          fi
          if grep -qi '\.exe$' assets.txt; then
            echo "has_exe=true" >> "$GITHUB_OUTPUT"
            echo "$tag already ships a Windows installer — nothing to do."
          else
            echo "has_exe=false" >> "$GITHUB_OUTPUT"
            echo "Windows asset missing for $tag — will build and upload."
          fi

      - name: Install dependencies
        if: steps.state.outputs.has_exe == 'false'
        run: npm ci

      - name: Build
        if: steps.state.outputs.has_exe == 'false'
        run: npm run build

      - name: Package Windows installer
        if: steps.state.outputs.has_exe == 'false'
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Attach Windows assets to the existing release
        if: steps.state.outputs.has_exe == 'false' && steps.state.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.value }}" \
            release/*.exe release/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Create the release with Windows assets
        if: steps.state.outputs.has_exe == 'false' && steps.state.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            release/*.exe release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Meteor ${{ steps.version.outputs.value }}" \
            --generate-notes \
            --latest
